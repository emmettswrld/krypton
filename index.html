<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" href="./styles/styles.css">
    </head>
    <body>
        <div id="bg">
            <div id="blur-overlay"></div>

            <div id="clock">
                <span id="clock-hrs"></span><span class="clock-sep">:</span><span id="clock-mins"></span><span class="clock-sep">:</span><span id="clock-secs"></span>
                <span class="clock-div"></span>
                <span class="clock-label">v2 alpha</span>
            </div>
            <div id="center">
                <h1>krypton</h1>
                <div id="tagline"></div>
            </div>

            <div id="engine-dropdown">
                <div class="engine-opt active" data-engine="ddg">DuckDuckGo</div>
                <div class="engine-opt" data-engine="bing">Bing</div>
                <div class="engine-opt" data-engine="google">Google</div>
            </div>
        </div>

        <div id="search-bar">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" placeholder="search or enter a URL...">
            <button id="engine-btn">DDG <i data-lucide="chevron-down" width="14" height="14"></i></button>
        </div>

        <div id="navbar">
            <button class="nav-btn" data-tooltip="Home"><i data-lucide="house" width="20" height="20"></i></button>
            <div class="nav-div"></div>
            <button class="nav-btn" data-tooltip="Games"><i data-lucide="gamepad-2" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="Browser"><i data-lucide="earth" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="Apps"><i data-lucide="layout-grid" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="Movies"><i data-lucide="clapperboard" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="Music"><i data-lucide="music" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="AI"><i data-lucide="sparkles" width="20" height="20"></i></button>
            <button class="nav-btn" data-tooltip="Chat"><i data-lucide="message-circle" width="20" height="20"></i></button>
            <div class="nav-div"></div>
            <button class="nav-btn" data-tooltip="Settings"><i data-lucide="settings" width="20" height="20"></i></button>
        </div>
        
        <script src="./scripts/main/script.js"></script>
    </body>
</html>
