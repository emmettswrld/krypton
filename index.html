<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" href="./styles/styles.css">
    </head>
    <body>
        <div id="bg">
            <div id="center">
                <h1>krypton</h1>
                <div id="tagline"></div>
                <div id="search-bar">
                    <i data-lucide="search" width="16" height="16"></i>
                    <input type="text" placeholder="search or enter a URL...">
                </div>
            </div>

            <div id="navbar">
                <button class="nav-btn" data-tooltip="Home"><i data-lucide="house" width="18" height="18"></i></button>
                <div class="nav-div"></div>
                <button class="nav-btn" data-tooltip="Games"><i data-lucide="gamepad-2" width="18" height="18"></i></button>
                <button class="nav-btn" data-tooltip="Apps"><i data-lucide="grid-2x2" width="18" height="18"></i></button>
                <button class="nav-btn" data-tooltip="Movies"><i data-lucide="clapperboard" width="18" height="18"></i></button>
                <button class="nav-btn" data-tooltip="Music"><i data-lucide="music" width="18" height="18"></i></button>
                <button class="nav-btn" data-tooltip="AI"><i data-lucide="sparkles" width="18" height="18"></i></button>
                <button class="nav-btn" data-tooltip="Chat"><i data-lucide="message-circle" width="18" height="18"></i></button>
                <div class="nav-div"></div>
                <button class="nav-btn" data-tooltip="Settings"><i data-lucide="settings" width="18" height="18"></i></button>
            </div>
        </div>
        

        <script src="./scripts/main/script.js"></script>

</html>
