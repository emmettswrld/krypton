<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" href="../styles/t.css"></link>
    </head>
    <body>
        <div class="app">
            <div class="sidebar">
                <div class="position:relative;">
                    <div class="sidebar-hdr" id="sidebarHeader">
                        <i data-lucide="globe" class="sidebar-hdr-icon"></i>
                        <span id="sidebarViewLabel">Chat</span>
                        <i data-lucide="chevron-down" class="sidebar-hdr-icon"></i>
                    </div>
                    <div class="view-dr" id="viewDropdown">
                        <div class="view-opt active" data-view="chat">
                            <i data-lucide="hash"></i><span>Chat</span>
                        </div>
                        <div class="view-opt" data-view="dms">
                            <i data-lucide="mail"></i><span>DMs</span>
                            <span class="view-opt-badge" id="dmBadge" style="display:none;"></span>
                        </div>
                    </div>
                </div>
                <div class="sidebar-scroll" id="sidebarScroll"></div>
                <div class="user-bar" id="userBar">
                    <div class="user-bar-avatar" id="userBarAvatar"></div>
                    <span class="user-bar-name" id="userBarName"></span>
                    <i data-lucide="settings" class="user-bar-icon"></i>
                </div>
            </div>
            <div class="main">
                <div class="topbar">
                    <div class="topbar-tl">
                        <i data-lucide="hash" class="topbar-icon"></i>
                        <span id="activeChannelName">general</span>
                    </div>
                    <div class="topbar-search">
                        <i data-lucide="search" class="topbar-search-icon"></i>
                        <input type="text" class="topbar-search-input" placeholder="Search messages...">
                    </div>
                </div>
                <div class="content" id="contentArea"></div>
                <div class="typing-indicator" id="typingIndicator"></div>
                <div class="prompt-bar">
                    <div class="prompt-group">
                        <div class="text-wpr">
                            <input type="text" class="text-input" id="messageInput" placeholder="Message #general">
                            <div class="text-actions">
                                <button class="text-action-btn" id="emojiBtn" title="Emoji">
                                    <i data-lucide="smile"></i>
                                </button>
                                <button class="text-action-btn" id="addBtn" title="Add">
                                    <i data-lucide="plus"></i>
                                </button>
                                <button class="text-action-btn" id="gifBtn" title="GIF">
                                    <i data-lucide="image-play"></i>
                                </button>
                            </div>
                        </div>
                        <button class="send-btn" id="sendBtn">
                            <i data-lucide="send" class="send-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="members-sidebar">
                <div class="members-hdr">
                    <span>Members</span>
                </div>
                <div class="members-scroll" id="membersScroll"></div>
            </div>
        </div>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card" id="modalCard"></div>
            <div class="mod-panel" id="modPanel"></div>
        </div>
        <script type="module" src="../scripts/chat/t.js"></script>
    </body>
</html>
