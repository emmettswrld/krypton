<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" href="../styles/l.css">
    </head>
    <body>
        <div class="sidebar">
            <div class="sb-item active" data-view="home">
                <i data-lucide="home"></i>
                <span>Home</span>
            </div>
            <div class="sb-item" data-view="library">
                <i data-lucide="library"></i>
                <span>Your Library</span>
            </div>
            <div class="sb-divider"></div>
            <div class="sb-item" data-view="playlists">
                <i data-lucide="list-music"></i>
                <span>Playlists</span>
            </div>
        </div>

        <div class="main-panel">
            <div class="top-bar">
                <div class="np-inline" id="npBar">
                    <i data-lucide="music" class="np-icon"></i>
                    <div class="np-inline-meta">
                        <div class="np-title" id="npTitle">Nothing playing</div>
                        <div class="np-progress">
                            <div class="np-progress-fill" id="npProgressFill"></div>
                        </div>
                    </div>
                    <button class="np-play-btn" id="npPlayBtn">
                        <i data-lucide="play"></i>
                    </button>
                </div>
                <div class="search-wpr">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search for a song, artist or album...">
                </div>
            </div>
            <div class="content-area" id="contentArea">
                <div class="card-grid" id="cardGrid"></div>
            </div>
        </div>
        <script src="../scripts/music/l.js"></script>
    </body>
</html>
