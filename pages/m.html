<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" href="../styles/m.css">
    </head>
    <body>
        <div class="top-bar">
            <div class="cat-sel" id="catSel">
                <button class="cat-btn active" data-cat="all">
                    <i data-lucide="layout-grid"></i>
                    <span>All</span>
                </button>
                <button class="cat-btn" data-cat="trending">
                    <i data-lucide="trending-up"></i>
                    <span>Trending</span>
                </button>
                <button class="cat-btn" data-cat="popular">
                    <i data-lucide="flame"></i>
                    <span>Popular</span>
                </button>
                <button class="cat-btn" data-cat="top_rated">
                    <i data-lucide="star"></i>
                    <span>Top Rated</span>
                </button>
                <button class="cat-btn" data-cat="now_playing">
                    <i data-lucide="clapperboard"></i>
                    <span>Now Playing</span>
                </button>
                <button class="cat-btn" data-cat="tv">
                    <i data-lucide="tv-2"></i>
                    <span>TV Shows</span>
                </button>
            </div>
            <div class="search-wpr">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search movies & shows...">
            </div>
        </div>
        <div class="movie-grid" id="movieGrid">
            <div class="grid-ld" id="gridLd">
                <div class="grid-spinner"></div>
            </div>
            <div class="scroll-st" id="st"></div>
        </div>
        <script src="../scripts/movies/m.js"></script>
    </body>
</html>
